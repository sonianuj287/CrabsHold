version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: crabshold-db
    environment:
      POSTGRES_USER: crabs_user
      POSTGRES_PASSWORD: crabs_password
      POSTGRES_DB: crabshold
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: crabshold-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
